content:
  - name: site
    label: Website text
    type: file
    path: content/site.json
    format: json
    fields:
      - { name: brand, label: Site name (top-left), type: string }
      - { name: nav_home, label: Menu - Home, type: string }
      - { name: nav_about, label: Menu - About, type: string }
      - { name: nav_assign, label: Menu - Today's Assignment, type: string }
      - { name: nav_turnin, label: Menu - Assignment Turn-In, type: string }
      - { name: nav_register, label: Menu - Registration, type: string }
      - { name: nav_courses, label: Menu - Courses, type: string }
      - { name: nav_training, label: Menu - Training, type: string }
      - { name: nav_star, label: Menu - Star Board, type: string }
      - { name: nav_contact, label: Menu - Contact, type: string }
      - { name: enrol_label, label: Top-right button, type: string }
      - { name: home_pill, label: Home - small label, type: string }
      - { name: home_h1_a, label: Home - headline (black), type: string }
      - { name: home_h1_b, label: Home - headline (orange), type: string }
      - { name: home_sub_a, label: Home - sentence, type: text }
      - { name: home_sub_b, label: Home - bold part of sentence, type: string }
      - { name: home_button, label: Home - big button, type: string }
      - { name: about_title, label: About - title, type: string }
      - { name: about_text, label: About - text, type: text }
      - { name: assign_title, label: Today's Assignment - title, type: string }
      - { name: assign_text, label: Today's Assignment - short line above the table, type: text }
      - { name: turnin_title, label: Turn-In - title, type: string }
      - { name: turnin_code_label, label: Turn-In - Student Code label, type: string }
      - { name: turnin_bad_code, label: Turn-In - message for a wrong Student Code, type: text }
      - { name: register_title, label: Registration - title, type: string }
      - { name: reg_note, label: Registration - note above the form, type: text }
      - { name: reg_consent, label: Registration - consent sentence, type: text }
      - { name: reg_id_title, label: Registration - I.D. heading, type: string }
      - { name: reg_id_help, label: Registration - I.D. instructions, type: text }
      - { name: reg_id_email, label: Registration - e-mail address for sending the I.D., type: string }
      - { name: contact_title, label: Contact - title, type: string }
      - { name: contact_name, label: Contact - name, type: string }
      - { name: contact_site, label: Contact - website, type: string }
      - { name: contact_phone, label: Contact - phone, type: string }
      - { name: contact_email, label: Contact - e-mail, type: string }
      - { name: choose_title, label: Language page - title, type: string }
      - { name: choose_text, label: Language page - text, type: text }
      - { name: choose_only, label: Language page - bold line, type: string }
      - { name: intro_en, label: Questionnaire instructions (English), type: text }
      - { name: intro_th, label: Questionnaire instructions (Thai), type: text }
      - { name: thanks_en, label: Thank-you message (English), type: text }
      - { name: thanks_th, label: Thank-you message (Thai), type: text }
      - { name: thanks_turnin, label: Thank-you message (Turn-In), type: text }
      - { name: thanks_register, label: Thank-you message (Registration), type: text }
  - name: assignment
    label: Today's Assignment
    type: file
    path: content/assignment.json
    format: json
    fields:
      - { name: empty, label: Message when there is no assignment, type: string }
      - name: rows
        label: Assignments (add, edit or delete rows)
        type: object
        list: true
        fields:
          - { name: date, label: Date (for example 2026.12.01), type: string }
          - { name: kind, label: Self-Opted or Assigned, type: string }
          - { name: topic, label: Topic, type: string }
          - { name: vocab, label: Vocabulary, type: text }
  - name: courses
    label: Courses
    type: file
    path: content/courses.json
    format: json
    fields:
      - { name: title, label: Page title, type: string }
      - { name: empty, label: Message when there are no courses, type: string }
      - { name: back, label: Back button text, type: string }
      - { name: more_heading, label: Heading above Other details, type: string }
      - name: list
        label: Courses (add, delete or drag to change the order)
        type: object
        list: true
        fields:
          - { name: title, label: Course name, type: string }
          - { name: period, label: "Time period (for example Jan - Mar 2027)", type: string }
          - { name: about, label: What the course is about, type: text }
          - { name: more, label: "Other details (fees, schedule, who it is for)", type: text }
  - name: training
    label: Training page text (codes and materials are in the Google Sheet)
    type: file
    path: content/training.json
    format: json
    fields:
      - { name: title, label: Page title, type: string }
      - { name: lock_title, label: Heading (Need Verification Code), type: string }
      - { name: notes, label: Bullet points under the heading, type: string, list: true }
      - { name: fee_label, label: Fee button text, type: string }
      - { name: fee_text, label: Fee structure (shown when the Fee button is pressed), type: text }
      - { name: vol_label, label: Volunteer button text, type: string }
      - { name: vol_text, label: Volunteer text (shown when the Volunteer button is pressed), type: text }
      - { name: vol_link, label: Volunteer Form link (for example a Google Form), type: string }
      - { name: vol_button, label: Text on the Volunteer Form link button, type: string }
      - { name: code_label, label: Text above the code box, type: string }
      - { name: code_button, label: Code button text, type: string }
      - { name: checking, label: Message while the code is being checked, type: string }
      - { name: wrong_code, label: Message for a wrong code, type: string }
      - { name: open_text, label: Message after the code is accepted, type: text }
      - { name: open_label, label: Text on each Open link, type: string }
      - { name: logout, label: Lock button text, type: string }
      - { name: empty, label: Message when there are no materials, type: string }
  - name: starboard
    label: Star Board
    type: file
    path: content/starboard.json
    format: json
    fields:
      - { name: title, label: Page title, type: string }
      - { name: subtitle, label: Line under the title, type: string }
      - { name: before_label, label: Word for Before, type: string }
      - { name: after_label, label: Word for After, type: string }
      - { name: empty, label: Message when the board is empty, type: string }
      - name: people
        label: Students (add one row per student - drag to change the order)
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: before, label: BEFORE recording - upload, type: file, options: { media: recordings } }
          - { name: before_link, label: BEFORE recording - OR paste a link, type: string }
          - { name: after, label: AFTER recording - upload, type: file, options: { media: recordings } }
          - { name: after_link, label: AFTER recording - OR paste a link, type: string }
media:
  - name: recordings
    label: Star Board recordings
    input: media/recordings
    output: /media/recordings
    extensions: [mp3, m4a, wav, ogg, aac]
    rename: safe
